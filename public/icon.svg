<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="orb" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="40%" stop-color="#e11d48" />
      <stop offset="80%" stop-color="#9f1239" />
      <stop offset="100%" stop-color="#4c0519" />
    </radialGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Outer Glow Aura -->
  <circle cx="256" cy="240" r="160" fill="url(#glow)" opacity="0.45" filter="url(#blur)" />

  <!-- Soundwave Rings -->
  <circle cx="256" cy="240" r="170" fill="none" stroke="#f43f5e" stroke-width="3" stroke-dasharray="12 12" opacity="0.6" />
  <circle cx="256" cy="240" r="195" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />

  <!-- Main Mita Glowing Orb -->
  <circle cx="256" cy="240" r="125" fill="url(#orb)" stroke="#fda4af" stroke-width="4" />

  <!-- Gloss Highlight -->
  <ellipse cx="225" cy="180" rx="45" ry="20" fill="#ffffff" opacity="0.35" transform="rotate(-25 225 180)" />

  <!-- Central Heart & Voice Audio Bars -->
  <!-- Heart Icon -->
  <path d="M256 280 C256 280 200 240 190 205 C180 170 215 150 238 175 L256 195 L274 175 C297 150 332 170 322 205 C312 240 256 280 256 280 Z" fill="#ffffff" opacity="0.95" />

  <!-- Sound Equalizer Waves below -->
  <rect x="220" y="300" width="8" height="24" rx="4" fill="#38bdf8" />
  <rect x="236" y="292" width="8" height="40" rx="4" fill="#ffffff" />
  <rect x="252" y="286" width="8" height="52" rx="4" fill="#f43f5e" />
  <rect x="268" y="292" width="8" height="40" rx="4" fill="#ffffff" />
  <rect x="284" y="300" width="8" height="24" rx="4" fill="#38bdf8" />

  <!-- Text "Mita AI" at bottom -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    MITA AI
  </text>
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#fda4af" text-anchor="middle" letter-spacing="1">
    বাংলা ভয়েস অ্যাসিস্ট্যান্ট
  </text>
</svg>
