    <script>
      (function() {
        // 1. Intercept console.error to filter benign Vite HMR WebSocket closed notice in Cloud Run dev server
        const _origConsoleError = console.error;
        console.error = function(...args) {
          const text = args.map(function(a) {
            return (a && a.message) || (typeof a === 'object' ? JSON.stringify(a) : String(a));
          }).join(' ');
          if (text.includes('[vite]') || text.includes('WebSocket closed without opened')) {
            return;
          }
          _origConsoleError.apply(console, args);
        };

        // 2. Intercept unhandled errors
        window.addEventListener('error', function(e) {
          if (e.message && (e.message.includes('WebSocket') || e.message.includes('vite'))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          const reason = String(e.reason || '');
          if (reason.includes('WebSocket') || reason.includes('vite')) {
            e.preventDefault();
          }
        });

        // 3. Stub the vite-hmr WebSocket so it opens cleanly without closing abruptly
        const _OrigWebSocket = window.WebSocket;
        if (_OrigWebSocket) {
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('vite') || url.includes('ais-dev')))) {
              var fakeWs = new EventTarget();
              fakeWs.readyState = 1; // WebSocket.OPEN
              fakeWs.url = url;
              fakeWs.protocol = protocols || '';
              fakeWs.send = function() {};
              fakeWs.close = function() {};
              setTimeout(function() {
                fakeWs.dispatchEvent(new Event('open'));
              }, 10);
              return fakeWs;
            }
            return new _OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = _OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }
      })();
    </script>
